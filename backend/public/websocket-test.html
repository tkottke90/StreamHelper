<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket Channel Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .panel {
            border: 1px solid #ccc;
            padding: 15px;
            border-radius: 5px;
        }
        .status {
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 3px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .status.hidden {
            display: none;
        }
        .connected {
            background-color: #d4edda;
            color: #155724;
        }
        .disconnected {
            background-color: #f8d7da;
            color: #721c24;
        }
        .dismiss-btn {
            background: transparent;
            border: none;
            color: inherit;
            font-size: 18px;
            cursor: pointer;
            padding: 0 5px;
            margin: 0;
            opacity: 0.7;
        }
        .dismiss-btn:hover {
            opacity: 1;
        }
        button {
            padding: 8px 15px;
            margin: 5px;
            cursor: pointer;
        }
        input {
            padding: 8px;
            margin: 5px;
            width: 200px;
        }
        #messages {
            height: 400px;
            overflow-y: auto;
            border: 1px solid #ddd;
            padding: 10px;
            background-color: #f9f9f9;
            font-family: monospace;
            font-size: 12px;
        }
        .message {
            margin: 5px 0;
            padding: 5px;
            border-left: 3px solid #007bff;
            background-color: white;
        }
        .error {
            border-left-color: #dc3545;
        }
        .success {
            border-left-color: #28a745;
        }
        .channel-list {
            list-style: none;
            padding: 0;
        }
        .channel-list li {
            padding: 5px;
            margin: 3px 0;
            background-color: #e9ecef;
            border-radius: 3px;
        }
        .key-value-pair {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
            align-items: center;
        }
        .key-input, .value-input {
            flex: 1;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            width: auto;
        }
        .remove-pair {
            padding: 8px 12px;
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .remove-pair:hover {
            background: #c82333;
        }
        #keyValuePairs {
            margin: 12px 0;
        }
        select {
            width: 100%;
            padding: 8px;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>WebSocket Channel Test Client</h1>

    <div id="status" class="status disconnected">
        <span id="statusText">Disconnected</span>
        <button class="dismiss-btn" id="dismissStatus" title="Dismiss">&times;</button>
    </div>
    
    <div class="container">
        <div class="panel">
            <h2>Setup</h2>
            <label for="apiKey">API Key:</label>
            <input type="text" id="apiKey" placeholder="Enter API key for authentication" style="width: 90%; margin-bottom: 10px;">

            <h3>Initialize Session</h3>
            <button id="fetchGames">Fetch Games</button>
            <select id="gameSelect" style="width: 90%; margin-bottom: 10px;" disabled>
                <option value="">Select a game...</option>
            </select>
            <button id="initializeSession" disabled>Initialize Session</button>
            <div id="sessionInfo" style="margin-top: 10px; padding: 10px; background: #e9ecef; border-radius: 4px; display: none;">
                <strong>Session UUID:</strong> <span id="sessionUUID"></span>
            </div>

            <h2>Connection</h2>
            <button id="connect" disabled>Connect</button>
            <button id="disconnect">Disconnect</button>

            <h2>Send Message</h2>
            <label for="eventType">Event Type:</label>
            <select id="eventType">
                <option value="game-data:update">game-data:update</option>
                <option value="custom">Custom Event Type</option>
            </select>
            <input type="text" id="customEventType" placeholder="Custom event type" style="display: none; margin-top: 8px;">

            <h3>Message Data:</h3>
            <div style="font-size: 12px; color: #666; margin-bottom: 10px;">
                sessionUUID is sent at top level. Other fields are nested in "data" object.
            </div>
            <div id="keyValuePairs">
                <div class="key-value-pair">
                    <input type="text" class="key-input" placeholder="Key" value="sessionUUID" readonly style="background-color: #f0f0f0;">
                    <input type="text" class="value-input" id="sessionUUIDInput" placeholder="Initialize a session first" readonly style="background-color: #f0f0f0;">
                    <button class="remove-pair" disabled style="opacity: 0.5; cursor: not-allowed;">Remove</button>
                </div>
                <div class="key-value-pair">
                    <input type="text" class="key-input" placeholder="Key (will be in data object)" value="speed">
                    <input type="text" class="value-input" placeholder="Value" value="100">
                    <button class="remove-pair">Remove</button>
                </div>
                <div class="key-value-pair">
                    <input type="text" class="key-input" placeholder="Key (will be in data object)" value="rpm">
                    <input type="text" class="value-input" placeholder="Value" value="5000">
                    <button class="remove-pair">Remove</button>
                </div>
            </div>
            <button id="addPair">Add Key-Value Pair</button>
            <button id="sendMessage">Send Message</button>
        </div>
        
        <div class="panel">
            <h2>Messages</h2>
            <button id="clearMessages">Clear</button>
            <div id="messages"></div>
        </div>
    </div>

    <script>
        let ws = null;
        let clientId = null;
        let authMethod = null; // Track which auth method was used
        let sessionUUID = null; // Track the current session
        let currentGameId = null; // Track the current game
        const joinedChannels = new Set();

        const statusEl = document.getElementById('status');
        const statusTextEl = document.getElementById('statusText');
        const messagesEl = document.getElementById('messages');
        const joinedChannelsEl = document.getElementById('joinedChannels');

        function addMessage(msg, type = 'info') {
            const div = document.createElement('div');
            div.className = `message ${type}`;
            div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            messagesEl.appendChild(div);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        function updateStatus(connected) {
            statusEl.className = `status ${connected ? 'connected' : 'disconnected'}`;
            statusEl.classList.remove('hidden');
            if (connected) {
                const authInfo = authMethod ? ` - Auth: ${authMethod}` : '';
                statusTextEl.textContent = `Connected (${clientId})${authInfo}`;
            } else {
                statusTextEl.textContent = 'Disconnected';
            }
        }

        // Dismiss status banner
        document.getElementById('dismissStatus').addEventListener('click', () => {
            statusEl.classList.add('hidden');
        });

        // Fetch games using API key
        document.getElementById('fetchGames').addEventListener('click', async () => {
            const apiKey = document.getElementById('apiKey').value.trim();
            if (!apiKey) {
                addMessage('Please enter an API key first', 'error');
                return;
            }

            try {
                const response = await fetch('/api/v1/game-data', {
                    headers: {
                        'X-API-Key': apiKey
                    }
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const data = await response.json();
                const gameSelect = document.getElementById('gameSelect');
                gameSelect.innerHTML = '<option value="">Select a game...</option>';

                if (data.games && data.games.length > 0) {
                    data.games.forEach(gameData => {
                        const option = document.createElement('option');
                        option.value = gameData.gameUUID;
                        option.textContent = `${gameData.game} (${gameData.gameUUID})`;
                        gameSelect.appendChild(option);
                    });
                    gameSelect.disabled = false;
                    document.getElementById('initializeSession').disabled = false;
                    addMessage(`Fetched ${data.games.length} game(s)`, 'success');
                } else {
                    addMessage('No games found. Please create a game first.', 'error');
                }
            } catch (error) {
                addMessage(`Failed to fetch games: ${error.message}`, 'error');
            }
        });

        // Initialize session
        document.getElementById('initializeSession').addEventListener('click', async () => {
            const apiKey = document.getElementById('apiKey').value.trim();
            const gameId = document.getElementById('gameSelect').value;

            if (!apiKey) {
                addMessage('Please enter an API key first', 'error');
                return;
            }

            if (!gameId) {
                addMessage('Please select a game first', 'error');
                return;
            }

            try {
                // Generate a new session UUID
                const newSessionUUID = crypto.randomUUID();

                const response = await fetch(`/api/v1/game-data/${gameId}/initialize-session`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-API-Key': apiKey
                    },
                    body: JSON.stringify({
                        sessionUUID: newSessionUUID,
                        gameUUID: gameId,
                        userUUID: 'auto' // Will be determined by the API key
                    })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.message || `HTTP ${response.status}: ${response.statusText}`);
                }

                sessionUUID = newSessionUUID;
                currentGameId = gameId;

                // Update UI
                document.getElementById('sessionUUID').textContent = sessionUUID;
                document.getElementById('sessionInfo').style.display = 'block';
                document.getElementById('connect').disabled = false;

                // Update the sessionUUID input field in the message data
                const sessionUUIDInput = document.getElementById('sessionUUIDInput');
                if (sessionUUIDInput) {
                    sessionUUIDInput.value = sessionUUID;
                }

                addMessage(`Session initialized: ${sessionUUID}`, 'success');
            } catch (error) {
                addMessage(`Failed to initialize session: ${error.message}`, 'error');
            }
        });

        function updateChannelList() {
            if (!joinedChannelsEl) return;

            joinedChannelsEl.innerHTML = '';
            joinedChannels.forEach(channel => {
                const li = document.createElement('li');
                li.textContent = channel;
                joinedChannelsEl.appendChild(li);
            });
        }

        document.getElementById('connect').addEventListener('click', () => {
            if (ws) return;

            statusEl.classList.add('hidden');

            // Use window.location.host to connect to the same host/port as the page
            const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            let wsUrl = `${wsProtocol}//${window.location.host}/api/v1/ws`;

            // Add API key as query parameter if provided
            const apiKey = document.getElementById('apiKey').value.trim();
            if (apiKey) {
                this.cookieStore.set('apiKey', apiKey);
                authMethod = 'API Key';
                addMessage('Connecting with API key authentication...', 'info');
            } else {
                authMethod = 'Cookie';
                addMessage('Connecting with cookie authentication...', 'info');
            }

            ws = new WebSocket(wsUrl);
            

            ws.onopen = () => {
                addMessage(`Connected to WebSocket server using ${authMethod} authentication`, 'success');
            };
            
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                addMessage(`Received: ${JSON.stringify(data, null, 2)}`);
                
                if (data.type === 'welcome') {
                    clientId = data.clientId;
                    updateStatus(true);
                } else if (data.type === 'joined') {
                    joinedChannels.add(data.channel);
                    updateChannelList();
                } else if (data.type === 'left') {
                    joinedChannels.delete(data.channel);
                    updateChannelList();
                }
            };
            
            ws.onerror = (error) => {
                addMessage(`Error: ${JSON.stringify(error)}`, 'error');
            };
            
            ws.onclose = () => {
                addMessage('Disconnected from server', 'error');
                updateStatus(false);
                ws = null;
                authMethod = null;
                joinedChannels.clear();
                updateChannelList();
            };
        });

        document.getElementById('disconnect').addEventListener('click', () => {
            if (ws) {
                ws.close();
            }
        });

        // Event type dropdown handler
        document.getElementById('eventType').addEventListener('change', (e) => {
            const customInput = document.getElementById('customEventType');
            if (e.target.value === 'custom') {
                customInput.style.display = 'block';
            } else {
                customInput.style.display = 'none';
            }
        });

        // Add key-value pair
        document.getElementById('addPair').addEventListener('click', () => {
            const container = document.getElementById('keyValuePairs');
            const pairDiv = document.createElement('div');
            pairDiv.className = 'key-value-pair';
            pairDiv.innerHTML = `
                <input type="text" class="key-input" placeholder="Key">
                <input type="text" class="value-input" placeholder="Value">
                <button class="remove-pair">Remove</button>
            `;
            container.appendChild(pairDiv);

            // Add remove handler
            pairDiv.querySelector('.remove-pair').addEventListener('click', () => {
                pairDiv.remove();
            });
        });

        // Add remove handlers to existing pairs (skip disabled ones)
        document.querySelectorAll('.remove-pair:not([disabled])').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.target.closest('.key-value-pair').remove();
            });
        });

        // Send message with key-value pairs
        document.getElementById('sendMessage').addEventListener('click', () => {
            if (!ws) {
                addMessage('Not connected to WebSocket', 'error');
                return;
            }

            if (!sessionUUID) {
                addMessage('Please initialize a session first', 'error');
                return;
            }

            // Get event type
            const eventTypeSelect = document.getElementById('eventType');
            let eventType = eventTypeSelect.value;

            if (eventType === 'custom') {
                eventType = document.getElementById('customEventType').value.trim();
                if (!eventType) {
                    addMessage('Please enter a custom event type', 'error');
                    return;
                }
            }

            // Collect key-value pairs
            const pairs = document.querySelectorAll('.key-value-pair');
            const messageData = {};
            const nestedData = {};

            pairs.forEach(pair => {
                const key = pair.querySelector('.key-input').value.trim();
                const value = pair.querySelector('.value-input').value.trim();

                if (key) {
                    // Parse the value (try JSON first, then use as string/number)
                    let parsedValue;
                    try {
                        parsedValue = JSON.parse(value);
                    } catch {
                        // If not valid JSON, try to parse as number
                        const numValue = Number(value);
                        parsedValue = isNaN(numValue) ? value : numValue;
                    }

                    // sessionUUID goes at the top level, everything else goes in data
                    if (key === 'sessionUUID') {
                        messageData.sessionUUID = parsedValue;
                    } else {
                        nestedData[key] = parsedValue;
                    }
                }
            });

            // Add the nested data object
            messageData.data = nestedData;

            // Send message
            const message = {
                type: eventType,
                data: messageData
            };

            ws.send(JSON.stringify(message));
            addMessage(`Sent: ${JSON.stringify(message, null, 2)}`, 'success');
        });

        document.getElementById('clearMessages').addEventListener('click', () => {
            messagesEl.innerHTML = '';
        });
    </script>
</body>
</html>
